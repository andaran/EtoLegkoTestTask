[project]
name = "etolegkotesttask"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM",
    "ARG", "RET", "PTH", "RUF", "TC", "ANN", "PYI", "blanket-type-ignore",
]
ignore = ["line-too-long", "ambiguous-unicode-character-comment", "ambiguous-unicode-character-docstring"]
fixable = ["ALL"]
unfixable = []
preview = true

[tool.ty.rules]
blanket-ignore-comment = "error"
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-assignment = "error"
unsound-return = "error"
unsound-yield = "error"
unsupported-dynamic-base = "warn"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true
